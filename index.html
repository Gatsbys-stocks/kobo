<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Comanda · Kobe BCN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (sincronización entre dispositivos) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    color-scheme: dark;
    --ink:#15110d;
    --ink-2:#1e1812;
    --ink-3:#2a2219;
    --paper:#f3ead9;
    --paper-2:#ece0c9;
    --paper-line: rgba(21,17,13,0.12);
    --stamp:#b23a2e;
    --stamp-dark:#8f2c22;
    --gold:#c79a52;
    --gold-soft: rgba(199,154,82,0.35);
    --text-hi: #f6efe1;
    --text-lo: rgba(246,239,225,0.58);
    --text-ink-hi: #1c150e;
    --text-ink-lo: rgba(28,21,14,0.6);
    --radius: 14px;
    --shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background-color: var(--ink);
    background-image:
      radial-gradient(1200px 600px at 15% -10%, #241c14 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #251b16 0%, transparent 55%);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  button, .mesa-tile, .barra-seat, .cat-btn, .lang-btn, .session-chip{touch-action:manipulation;}
  input, textarea{font-size:16px;} /* evita el zoom automático de iOS al enfocar */
  .display{font-family:'Shippori Mincho', serif;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  [hidden]{display:none !important;}

  .topbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
    padding:16px 20px;
    padding-top:calc(16px + env(safe-area-inset-top));
    border-bottom:1px solid rgba(246,239,225,0.08);
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(21,17,13,0.97), rgba(21,17,13,0.9));
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--stamp);
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:800;color:var(--text-hi);
    font-size:15px; letter-spacing:0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
    flex:none;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:0.02em;}
  .brand small{color:var(--text-lo);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;}

  .lang-switch{display:flex;gap:6px;flex:none;}
  .sync-badge{
    margin-left:auto;flex:none;
    font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:20px;
    border:1px solid rgba(246,239,225,.16);color:var(--text-lo);white-space:nowrap;
  }
  .sync-badge.on{color:#8fd39e;border-color:rgba(143,211,158,.35);background:rgba(143,211,158,.08);}
  .sync-badge.off{color:#e0b064;border-color:rgba(224,176,100,.35);background:rgba(224,176,100,.08);}

  .session-chip{
    display:flex;align-items:center;gap:4px;
    background:transparent;border:1px solid rgba(246,239,225,0.16);
    color:var(--text-lo);padding:6px 12px;border-radius:20px;
    font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .session-chip b{color:var(--gold);font-weight:800;}
  .session-chip:hover{border-color:var(--gold-soft);color:var(--text-hi);}

  /* ---------- Login: código de sesión ---------- */
  #login-view{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:30px 22px;
    background-color: var(--ink);
  }
  .login-wrap{max-width:520px;width:100%;text-align:center;}
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px;}
  .login-brand .mark{
    width:54px;height:54px;border-radius:50%;
    background:var(--stamp);
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:800;color:var(--text-hi);
    font-size:24px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15), var(--shadow);
  }
  .login-brand h1{font-family:'Shippori Mincho',serif;font-size:28px;margin:0;font-weight:700;}
  .login-sub{color:var(--text-lo);font-size:13.5px;line-height:1.5;max-width:360px;margin:0 auto 30px;}
  .login-form{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .session-input{
    width:220px;
    background:rgba(246,239,225,0.05);
    border:2px solid rgba(246,239,225,0.16);
    border-radius:14px;
    color:var(--text-hi);
    font-family:'Shippori Mincho',serif;
    font-size:32px;font-weight:700;
    letter-spacing:0.5em;
    text-align:center;
    padding:16px 10px 16px 20px;
    outline:none;
  }
  .session-input::placeholder{color:rgba(246,239,225,0.25);letter-spacing:0.5em;}
  .session-input:focus{border-color:var(--gold);}
  .session-submit{
    background:linear-gradient(160deg,#d9ac52,#b9862f);
    color:#2a1d0c;border:none;border-radius:30px;
    font-weight:800;font-size:14px;letter-spacing:0.03em;
    padding:12px 34px;cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .session-submit:active{transform:translateY(1px);}
  .login-error{
    color:#e8a49c;font-size:12.5px;font-weight:600;margin-top:16px;
  }
  .login-form.shake{animation:shakeInput .3s;}
  @keyframes shakeInput{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .lang-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid rgba(246,239,225,0.16);
    color:var(--text-lo);padding:6px 10px 6px 6px;border-radius:20px;
    font-size:11px;font-weight:700;letter-spacing:0.03em;cursor:pointer;
    transition:.15s;
  }
  .lang-btn:hover{border-color:var(--gold-soft);color:var(--text-hi);}
  .lang-btn.active{border-color:var(--gold);background:rgba(199,154,82,0.12);color:var(--gold);}
  .flag{width:18px;height:13px;border-radius:2px;flex:none;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.25);}
  .flag-es{background:linear-gradient(#c60b1e 0 25%, #ffc400 25% 75%, #c60b1e 75% 100%);}
  .flag-ca{background:repeating-linear-gradient(#ffcc00 0 11.11%, #da121a 11.11% 22.22%);}
  .flag-en{
    background:#012169;
    background-image:
      linear-gradient(45deg, transparent 44%, #fff 44% 56%, transparent 56%),
      linear-gradient(-45deg, transparent 44%, #fff 44% 56%, transparent 56%),
      linear-gradient(transparent 38%, #fff 38% 62%, transparent 62%),
      linear-gradient(90deg, transparent 40%, #fff 40% 60%, transparent 60%),
      linear-gradient(transparent 42%, #c8102e 42% 58%, transparent 58%),
      linear-gradient(90deg, transparent 44%, #c8102e 44% 56%, transparent 56%);
  }

  /* ---------- Home: plano de sala ---------- */
  #home-view{padding:18px 22px 0;padding-bottom:env(safe-area-inset-bottom);max-width:1500px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1;min-height:0;}
  .home-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .home-head .eyebrow{
    color:var(--gold);letter-spacing:0.24em;text-transform:uppercase;font-size:10.5px;font-weight:600;
  }
  .home-head h2{
    font-family:'Shippori Mincho',serif;font-weight:700;font-size:22px;margin:3px 0 0;
  }
  .legend{display:flex;gap:16px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-lo);}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .legend i.free{background:#5b5044;border:1px solid rgba(246,239,225,0.25);}
  .legend i.busy{background:var(--stamp);}
  .legend i.barra{background:#4a4038;border:1px solid var(--gold-soft);border-radius:50%;}

  /* floor */
  .floor-wrap{
    flex:1;min-height:0;overflow:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    border:1px solid rgba(246,239,225,0.1);
    border-radius:10px;
    background-color: #1a1510;
    background-image:
      linear-gradient(rgba(246,239,225,0.05) 1px, transparent 1px) 0 0/100px 100px,
      linear-gradient(90deg, rgba(246,239,225,0.05) 1px, transparent 1px) 0 0/100px 100px,
      radial-gradient(1200px 500px at 30% 0%, #241d15 0%, transparent 60%);
    padding:20px;
  }
  .floor{
    position:relative;
    display:grid;
    grid-template-columns:repeat(13, minmax(64px,1fr));
    grid-auto-rows:78px;
    gap:6px;
    min-width:920px;
  }
  .deco-bar{
    border-radius:5px;
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0.06) 0 3px, transparent 3px 9px),
      linear-gradient(160deg, #c9973f 0%, #a9762c 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2), 0 6px 14px rgba(0,0,0,0.35);
    opacity:0.9;
  }
  .barra-seat{
    grid-row:1;
    width:52px;height:52px;border-radius:50%;
    align-self:center; justify-self:center;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:var(--text-hi);
    background:radial-gradient(circle at 34% 30%, #4c4238 0%, #2b241c 75%);
    border:2px solid rgba(246,239,225,0.16);
    cursor:pointer;transition:.15s;
  }
  .barra-seat:hover{border-color:var(--gold-soft);transform:translateY(-2px);}
  .barra-seat.busy{
    border-color:var(--stamp);
    background:radial-gradient(circle at 34% 30%, #5c2c22 0%, #341a15 75%);
    box-shadow:0 0 0 3px rgba(178,58,46,0.18);
  }

  .mesa-tile{
    position:relative;
    align-self:center; justify-self:center;
    width:100%; height:56px;
    display:flex;align-items:center;justify-content:center;
    gap:4px;
    cursor:pointer;
  }
  .mesa-tile.big{
    transform:scale(1.4);
    z-index:4;
  }
  .mesa-tile .chair{
    width:9px;height:20px;flex:none;
    background:linear-gradient(160deg,#e7ddc9,#b9ac8f);
    border:1px solid rgba(0,0,0,0.25);
    border-radius:2px;
  }
  .mesa-tile .top{
    flex:1;height:100%;position:relative;
    border-radius:4px;
    background:linear-gradient(160deg, #8a7458 0%, #5f4d38 100%);
    border:1px solid rgba(0,0,0,0.3);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.3);
    transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .mesa-tile:hover .top{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07), 0 8px 16px rgba(0,0,0,0.4);}
  .mesa-tile .plate{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #d8cfb9 80%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);
    display:none;
  }
  .mesa-tile.busy .top{
    background:linear-gradient(160deg, #7a4234 0%, #522a20 100%);
    box-shadow:0 0 0 2px rgba(178,58,46,0.4), 0 6px 14px rgba(0,0,0,0.4);
  }
  .mesa-tile.busy .plate{display:block;}
  .mesa-badge{
    position:absolute;top:-11px;left:-8px;
    background:linear-gradient(160deg,#e8c3cf,#cf9fb0);
    color:#3a1f27;
    font-size:11px;font-weight:800;
    width:24px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
    z-index:2;
  }
  .mesa-tile.busy .mesa-badge{
    background:linear-gradient(160deg,var(--stamp),var(--stamp-dark));
    color:var(--text-hi);
  }
  .mesa-total{
    position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
    font-size:9.5px;font-weight:700;color:var(--gold);white-space:nowrap;
  }

  /* toolbar */
  .floor-toolbar{
    display:flex;align-items:stretch;gap:10px;
    padding:14px 0 20px;flex-wrap:wrap;
  }
  .status-key{
    display:flex;flex-direction:column;justify-content:center;gap:4px;
    background:rgba(246,239,225,0.04);border:1px solid rgba(246,239,225,0.1);
    border-radius:8px;padding:8px 14px;font-size:10.5px;
  }
  .status-key div{display:flex;align-items:center;gap:7px;color:var(--text-lo);}
  .status-key div b{color:var(--text-hi);font-weight:600;}
  .status-key .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .toolbar-btns{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .tb-btn{
    flex:1;min-width:120px;
    background:linear-gradient(160deg,#d9ac52,#b9862f);
    color:#2a1d0c;border:none;border-radius:8px;
    font-weight:800;font-size:12px;letter-spacing:0.03em;
    padding:0 14px;cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .tb-btn:active{transform:translateY(1px);}
  .tb-btn.ghost{
    background:rgba(246,239,225,0.06);color:var(--text-hi);
    border:1px solid rgba(246,239,225,0.16);
    box-shadow:none;font-weight:600;
  }
  .tb-btn.danger{
    background:linear-gradient(160deg,#c65a4a,#8f2c22);
    color:#f6efe1;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  /* ---------- Table / comanda view ---------- */
  #table-view{flex:1;display:flex;flex-direction:column;min-height:0;}
  .table-topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid rgba(246,239,225,0.18);
    color:var(--text-hi);padding:9px 14px;border-radius:30px;
    font-size:13px;cursor:pointer;transition:.15s;
  }
  .back-btn:hover{border-color:var(--gold-soft);}
  .table-title{display:flex;align-items:center;gap:10px;}
  .table-title .num{
    font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;
    background:var(--stamp);width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .table-title h2{margin:0;font-size:18px;font-weight:700;}

  .search-wrap{
    flex:1;min-width:220px;position:relative;
  }
  .search-wrap input{
    width:100%;
    background:rgba(246,239,225,0.06);
    border:1px solid rgba(246,239,225,0.16);
    color:var(--text-hi);
    padding:11px 16px 11px 38px;
    border-radius:30px;
    font-size:14px;
    outline:none;
  }
  .search-wrap input::placeholder{color:var(--text-lo);}
  .search-wrap input:focus{border-color:var(--gold);}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;}

  .table-actions{display:flex;gap:8px;flex:none;}
  .pay-btn{
    background:linear-gradient(160deg,#7fae6f,#4f7d43);
    border:1px solid rgba(0,0,0,0.15);
    color:#f4ede1;padding:9px 16px;border-radius:30px;
    font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .pay-btn:hover{filter:brightness(1.08);}
  .clear-mesa-btn{
    background:transparent;border:1px solid rgba(178,58,46,0.4);
    color:#e8a49c;padding:9px 14px;border-radius:30px;font-size:13px;cursor:pointer;
  }
  .clear-mesa-btn:hover{background:rgba(178,58,46,0.12);}

  .table-body{
    flex:1;display:flex;min-height:0;
  }

  /* category rail */
  .cat-rail{
    width:190px;flex:none;
    border-right:1px solid rgba(246,239,225,0.08);
    overflow-y:auto;
    padding:14px 10px 40px;
  }
  .cat-btn{
    width:100%;text-align:left;
    background:transparent;border:none;color:var(--text-lo);
    padding:9px 12px;border-radius:9px;font-size:13px;
    cursor:pointer;margin-bottom:2px;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    transition:.15s;
  }
  .cat-btn:hover{background:rgba(246,239,225,0.05);color:var(--text-hi);}
  .cat-btn.active{background:rgba(199,154,82,0.14);color:var(--gold);font-weight:600;}
  .cat-group-label{
    font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(246,239,225,0.32);
    padding:14px 12px 4px;
  }
  .cat-group-label:first-child{padding-top:4px;}

  /* items area */
  .items-area{
    flex:1;overflow-y:auto;padding:20px 22px 40px;
  }
  .items-heading{
    font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;margin:0 0 4px;
  }
  .items-sub{color:var(--text-lo);font-size:12.5px;margin:0 0 16px;}
  .item-row{
    color-scheme: light;
    display:flex;align-items:center;gap:14px;
    background:var(--paper);
    border:1px solid var(--paper-2);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .item-row.in-order{border-color:var(--stamp);box-shadow:0 0 0 2px rgba(178,58,46,0.15), 0 2px 6px rgba(0,0,0,0.15);}
  .item-info{flex:1;min-width:0;}
  .item-info .name{font-size:14.5px;font-weight:700;color:#000;}
  .item-info .name .cat-pill{
    font-size:9.5px;font-weight:600;color:var(--stamp-dark);
    border:1px solid rgba(178,58,46,0.35);border-radius:20px;padding:1px 7px;margin-left:8px;
    text-transform:uppercase;letter-spacing:0.06em;vertical-align:middle;
  }
  .item-info .desc{font-size:12px;color:#000;opacity:0.62;margin-top:2px;line-height:1.4;}
  .item-price{font-size:13.5px;color:var(--stamp-dark);font-weight:800;min-width:58px;text-align:right;}
  .qty-ctrl{display:flex;align-items:center;gap:0;flex:none;}
  .qty-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,0.2);
    background:rgba(0,0,0,0.04);color:#000;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;
  }
  .qty-btn:active{background:rgba(0,0,0,0.12);}
  .qty-num{width:30px;text-align:center;font-weight:700;font-size:14px;color:#000;}
  .qty-btn.add-only{
    width:auto;padding:0 14px;border-radius:20px;background:var(--stamp);border-color:var(--stamp);
    color:var(--text-hi);
    font-size:12.5px;font-weight:600;
  }
  .empty-state{color:var(--text-lo);font-size:13.5px;padding:30px 6px;text-align:center;}

  /* confirm dialog + toast (replacing native confirm/alert for compatibility) */
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;z-index:200;
    padding:20px;
  }
  .confirm-box{
    color-scheme: light;
    background:var(--paper);color:#000;border-radius:12px;
    padding:22px 22px 16px;max-width:320px;width:100%;
    box-shadow:var(--shadow);text-align:center;
  }
  .confirm-box p{margin:0 0 18px;font-size:14.5px;font-weight:600;line-height:1.4;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{
    flex:1;padding:11px 10px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;border:none;
  }
  .confirm-cancel{background:rgba(0,0,0,0.08);color:#000;}
  .confirm-ok{background:var(--stamp);color:var(--text-hi);}
  .toast{
    color-scheme: light;
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);

function buildMenu(lang){
  return MENU_SRC.map(function(sec, si){
    return {
      cat: sec.cat[lang], group: sec.group[lang],
      items: sec.items.map(function(it, ii){
        return { id: si+'-'+ii, name: it[lang][0], desc: it[lang][1], price: it.price };
      })
    };
  });
}
function buildFlat(menu){
  const flat = [];
  menu.forEach(function(section){
    section.items.forEach(function(it){
      flat.push({ id: it.id, cat: section.cat, group: section.group, name: it.name, desc: it.desc, price: it.price });
    });
  });
  return flat;
}

function tableTotal(t){
  const o = orders[t];
  return Object.keys(o).reduce((sum,id)=>{
    const item = FLAT.find(f=>f.id===id);
    return sum + (item ? item.price*o[id] : 0);
  },0);
}
function tableCount(t){
  return Object.values(orders[t]).reduce((a,b)=>a+b,0);
}

function updateSyncBadge(on){
  const el = document.getElementById("sync-badge");
  if(!el) return;
  el.textContent = (on ? "🟢 " : "🔶 ") + (on ? I18N[currentLang].syncOn : I18N[currentLang].syncOff);
  el.classList.toggle("on", on);
  el.classList.toggle("off", !on);
}
function historyFromSnapshot(val){
  if(!val) return [];
  return Object.keys(val).sort().map(k => ({
    id: k, table: val[k].table, ts: val[k].ts,
    items: val[k].items || [], total: val[k].total || 0
  }));
}
function parkedFromSnapshot(val){
  if(!val) return [];

    id: k, label: val[k].label, ts: val[k].ts,
    items: val[k].items || {}, total: val[k].total || 0
  }));
}

  } else if(document.getElementById("table-view").hidden === false){
    renderItems();
    renderTicket();
  }
}
// Conexión base a Firebase (una sola vez, independiente del código de sesión).
function connectFirebase(){
  const configured = typeof firebase !== "undefined"
    && FIREBASE_CONFIG.apiKey
    && FIREBASE_CONFIG.apiKey.indexOf("TU_API_KEY") === -1;
  if(!configured){
    firebaseReady = false;
    updateSyncBadge(false);
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().signInAnonymously().then(()=>{
      db = firebase.database();
      firebaseReady = true;
      updateSyncBadge(true);
      if(currentSession) attachSessionListeners(currentSession);
    }).catch(err=>{
      console.warn("Firebase auth error:", err);
      firebaseReady = false;
      updateSyncBadge(false);
    });
  } catch(err){
    console.warn("Firebase init error:", err);
    firebaseReady = false;
    updateSyncBadge(false);
  }
}
// Engancha los listeners en tiempo real a la sala del código elegido.
function attachSessionListeners(code){
  detachSessionListeners();
  ordersRef = db.ref("sessions/" + code + "/orders");
  historyRef = db.ref("sessions/" + code + "/history");
  parkedRef = db.ref("sessions/" + code + "/parked");
  ordersRef.on("value", snap=>{
    const val = snap.val() || {};
    const next = {};
    ALL_IDS.forEach(id => { next[id] = val[id] || {}; });
    orders = next;
    refreshAfterOrdersChange();
  });
  historyRef.on("value", snap=>{
    history = historyFromSnapshot(snap.val());
  });
  parkedRef.on("value", snap=>{
    parked = parkedFromSnapshot(snap.val());
  });
}
function detachSessionListeners(){
  if(ordersRef) ordersRef.off();
  if(historyRef) historyRef.off();
  if(parkedRef) parkedRef.off();
  ordersRef = null;
  historyRef = null;
  parkedRef = null;
}
// Entrar en una sesión (código de sala compartida).
function joinSession(code){
  currentSession = code;
  orders = {};
  ALL_IDS.forEach(id => orders[id] = {});
  history = [];
  parked = [];
  document.getElementById("current-session-label").textContent = code;
  if(firebaseReady){
    attachSessionListeners(code);
  }
  document.getElementById("login-view").hidden = true;
  document.getElementById("table-view").hidden = true;
  document.getElementById("home-view").hidden = false;
  renderHome();
}
// Salir de la sesión y volver a la pantalla de código.
function leaveSession(){
  detachSessionListeners();
  currentSession = null;
  orders = {};
  ALL_IDS.forEach(id => orders[id] = {});
  history = [];
  parked = [];
  currentTable = null;
  document.getElementById("home-view").hidden = true;
  document.getElementById("table-view").hidden = true;
  document.getElementById("mobile-ticket-toggle").hidden = true;
  document.getElementById("login-view").hidden = false;
  document.getElementById("login-error").hidden = true;
  document.getElementById("session-input").value = "";
}
// Escritura de pedidos: si hay Firebase, se persiste ahí (y el listener
// de arriba actualiza la vista); si no, se actualiza solo en local.
function writeQty(tableId, itemId, qty){
  if(firebaseReady && currentSession){
    const path = "sessions/" + currentSession + "/orders/" + tableId + "/" + itemId;
    if(qty <= 0) db.ref(path).remove();
    else db.ref(path).set(qty);
  } else {
    if(qty <= 0) delete orders[tableId][itemId];
    else orders[tableId][itemId] = qty;
    refreshAfterOrdersChange();
  }
}
function writeClearTable(tableId){
  if(firebaseReady && currentSession){
    db.ref("sessions/" + currentSession + "/orders/" + tableId).remove();
  } else {
    orders[tableId] = {};
    refreshAfterOrdersChange();
  }
}
function writePay(tableId, record){
  if(firebaseReady && currentSession){
    db.ref("sessions/" + currentSession + "/history").push(record);
    db.ref("sessions/" + currentSession + "/orders/" + tableId).remove();
  } else {
    record.id = historyCounter++;
    history.push(record);
    orders[tableId] = {};
  }
}
function writeCloseDay(){
  if(firebaseReady && currentSession){
    db.ref("sessions/" + currentSession + "/orders").remove();
    db.ref("sessions/" + currentSession + "/history").remove();
    db.ref("sessions/" + currentSession + "/parked").remove();
  } else {
    orders = {};
    ALL_IDS.forEach(id => orders[id] = {});
    history = [];
    parked = [];
  }
}
function writePark(tableId, label){
  const items = Object.assign({}, orders[tableId]);
  const localeMap = { es:"es-ES", ca:"ca-ES", en:"en-GB" };
  const record = {
    label: label,
    ts: new Date().toLocaleString(localeMap[currentLang],{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),
    items: items,
    total: tableTotal(tableId)
  };
  if(firebaseReady && currentSession){
    db.ref("sessions/" + currentSession + "/parked").push(record);
    db.ref("sessions/" + currentSession + "/orders/" + tableId).remove();
  } else {
    record.id = "p" + (parkedCounter++);
    parked.push(record);
    orders[tableId] = {};
  }
}
function writeRemoveParked(key){
  if(firebaseReady && currentSession){
    db.ref("sessions/" + currentSession + "/parked/" + key).remove();
  } else {
    parked = parked.filter(p => p.id !== key);
  }
}
function resumeParked(key, targetId){
  const rec = parked.find(p => p.id === key);
  if(!rec) return;
  Object.keys(rec.items).forEach(id=>{
    const addQty = rec.items[id];
    const cur = orders[targetId][id] || 0;
    writeQty(targetId, id, cur + addQty);
  });
  writeRemoveParked(key);
}
function mergeTables(source, dest){
  const items = orders[source] || {};
  Object.keys(items).forEach(id=>{
    const addQty = items[id];
    const cur = orders[dest][id] || 0;
    writeQty(dest, id, cur + addQty);
  });
  writeClearTable(source);
}

/* ===================== CONFIRM / TOAST (propios, sin confirm()/alert() nativos) ===================== */
function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{
    t.classList.remove("show");
    setTimeout(()=>t.remove(), 300);
  }, 2400);
}
function showConfirm(msg, okLabel, onYes){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <div class="confirm-actions">
        <button class="confirm-cancel">${I18N[currentLang].cancel}</button>
        <button class="confirm-ok">${okLabel}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());
  overlay.querySelector(".confirm-ok").addEventListener("click", ()=>{
    overlay.remove();
    onYes();
  });
}

function showPrompt(msg, placeholder, okLabel, onSubmit){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <input type="text" class="prompt-input" placeholder="${placeholder}" maxlength="30">
      <div class="confirm-actions">
        <button class="confirm-cancel">${I18N[currentLang].cancel}</button>
        <button class="confirm-ok">${okLabel}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector(".prompt-input");
  setTimeout(()=>input.focus(), 50);
  const submit = ()=>{
    const val = input.value.trim();
    overlay.remove();
    onSubmit(val);
  };
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());
  overlay.querySelector(".confirm-ok").addEventListener("click", submit);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
}

// Selector de mesa/barra genérico (para juntar mesas y recuperar tiquets aparcados).
function openTablePicker(promptText, onPick, excludeId){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  const chips = ALL_IDS.filter(id => id !== excludeId).map(id=>{
    const busy = tableCount(id) > 0;
    return `<button class="picker-chip${busy ? " busy" : ""}" data-id="${id}">${tableLabel(id)}</button>`;
  }).join("");
  overlay.innerHTML = `
    <div class="picker-box">
      <p>${promptText}</p>
      <div class="picker-grid">${chips}</div>
      <button class="picker-cancel">${I18N[currentLang].cancel}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".picker-cancel").addEventListener("click", ()=>overlay.remove());
  overlay.querySelectorAll(".picker-chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = Number(btn.dataset.id);
      overlay.remove();
      onPick(id);
    });
  });
}

function renderItems(){
  const area = document.getElementById("items-area");
  const heading = document.getElementById("items-heading");
  let list, title, sub;

  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = FLAT.filter(f => f.name.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
    title = I18N[currentLang].resultsHeading;
    sub = I18N[currentLang].resultsSub(list.length, searchTerm);
  } else {
    list = FLAT.filter(f=>f.cat===currentCat);
    title = currentCat;
    sub = I18N[currentLang].catSub(list.length);
  }

  area.innerHTML = `<h3 class="items-heading">${title}</h3><p class="items-sub">${sub}</p>`;

  if(list.length===0){
    area.innerHTML += `<div class="empty-state">${I18N[currentLang].noResults}</div>`;
    return;
  }

  const wrap = document.createElement("div");
  wrap.className = "items-wrap";
  list.forEach(item=>{
    const qty = orders[currentTable][item.id] || 0;
    const row = document.createElement("div");
    row.className = "item-row" + (qty>0 ? " in-order" : "");
    row.innerHTML = `
      <div class="item-info">
        <div class="name">${item.name}${searchTerm.trim() ? `<span class="cat-pill">${item.cat}</span>` : ""}</div>
        ${item.desc ? `<div class="desc">${item.desc}</div>` : ""}
      </div>
      <div class="item-price">${eur(item.price)}</div>
      <div class="qty-ctrl" data-id="${item.id}">
        ${qty>0 ? `
          <button class="qty-btn minus">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn plus">+</button>
        ` : `
          <button class="qty-btn add-only">${I18N[currentLang].add}</button>
        `}
      </div>
    `;
    wrap.appendChild(row);
  });
  area.appendChild(wrap);

  area.querySelectorAll(".qty-ctrl").forEach(ctrl=>{
    const id = ctrl.dataset.id;
    const plus = ctrl.querySelector(".plus, .add-only");
    const minus = ctrl.querySelector(".minus");
    if(plus) plus.addEventListener("click", ()=>changeQty(id, 1));
    if(minus) minus.addEventListener("click", ()=>changeQty(id, -1));
  });
}

function changeQty(id, delta){
  const cur = orders[currentTable][id] || 0;
  const next = cur + delta;
  writeQty(currentTable, id, next);
}

function renderTicket(){
  const itemsEl = document.getElementById("ticket-items");
  const o = orders[currentTable];
  const ids = Object.keys(o);
  if(ids.length===0){
    itemsEl.innerHTML = `<div class="ticket-empty">${I18N[currentLang].ticketEmpty}</div>`;
  } else {
    itemsEl.innerHTML = ids.map(id=>{
      const item = FLAT.find(f=>f.id===id);
      const qty = o[id];
      return `
        <div class="ticket-line" data-id="${id}">
          <div class="l-name"><span class="q">${qty}×</span>${item.name}</div>
          <div class="l-price">${eur(item.price*qty)}</div>
          <button class="l-remove" title="Quitar">✕</button>
        </div>
      `;
    }).join("");
    itemsEl.querySelectorAll(".ticket-line").forEach(line=>{
      line.querySelector(".l-remove").addEventListener("click", ()=>{
        writeQty(currentTable, line.dataset.id, 0);
      });
    });
  }
  document.getElementById("ticket-total").textContent = eur(tableTotal(currentTable));
  const count = tableCount(currentTable);
  document.getElementById("ticket-count").textContent = I18N[currentLang].itemsCount(count);
  const badge = document.getElementById("mobile-ticket-badge");
  badge.textContent = count>0 ? "· " + count : "";
}

/* ===================== EVENTS ===================== */
document.getElementById("back-btn").addEventListener("click", backToHome);

document.getElementById("search-input").addEventListener("input", (e)=>{
  searchTerm = e.target.value;
  renderCatRail();
  renderItems();
});

document.getElementById("pay-btn").addEventListener("click", ()=>{
  const t = currentTable;
  if(tableCount(t)===0){
    showToast(I18N[currentLang].toastNoOrderToPay);
    return;
  }
  const total = tableTotal(t);
  showConfirm(I18N[currentLang].confirmPay(tableLabel(t), eur(total)), I18N[currentLang].payOk, ()=>{
    const items = Object.keys(orders[t]).map(id=>{
      const item = FLAT.find(f=>f.id===id);
      return { name:item.name, qty:orders[t][id], price:item.price };
    });
    const localeMap = { es:"es-ES", ca:"ca-ES", en:"en-GB" };
    const record = {
      table: tableLabel(t),
      ts: new Date().toLocaleString(localeMap[currentLang],{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}),
      items,
      total
    };
    writePay(t, record);
    showToast(I18N[currentLang].toastPaid(tableLabel(t), eur(total)));
    backToHome();
  });
});

document.getElementById("park-btn").addEventListener("click", ()=>{
  const t = currentTable;
  if(tableCount(t)===0){
    showToast(I18N[currentLang].toastNoOrderToPark);
    return;
  }
  showPrompt(I18N[currentLang].parkPrompt, I18N[currentLang].parkPlaceholder, I18N[currentLang].parkOk, (label)=>{
    const finalLabel = label || tableLabel(t);
    writePark(t, finalLabel);
    showToast(I18N[currentLang].toastParked);
    backToHome();
  });
});

document.getElementById("clear-mesa-btn").addEventListener("click", ()=>{
  if(tableCount(currentTable)===0){
    showToast(I18N[currentLang].toastTableEmptyAlready);
    return;
  }
  showConfirm(I18N[currentLang].confirmClear(tableLabel(currentTable)), I18N[currentLang].clearOk, ()=>{
    writeClearTable(currentTable);
    showToast(I18N[currentLang].toastCleared);
  });
});

document.getElementById("btn-cerrar-dia").addEventListener("click", ()=>{
  showConfirm(I18N[currentLang].confirmCloseDay, I18N[currentLang].closeDayOk, ()=>{
    writeCloseDay();
    showToast(I18N[currentLang].toastDayClosed);
    backToHome();
  });
});

document.getElementById("change-session-btn").addEventListener("click", leaveSession);

document.getElementById("login-form").addEventListener("submit", (e)=>{
  e.preventDefault();
  const input = document.getElementById("session-input");
  const errorEl = document.getElementById("login-error");
  const code = input.value.trim();
  if(SESSION_CODES.includes(code)){
    errorEl.hidden = true;
    input.value = "";
    joinSession(code);
  } else {
    errorEl.hidden = false;
    const form = document.getElementById("login-form");
    form.classList.remove("shake");
    void form.offsetWidth; // reinicia la animación
    form.classList.add("shake");
    input.value = "";
    input.focus();
  }
});

document.getElementById("mobile-ticket-toggle").addEventListener("click", ()=>{
  document.getElementById("ticket-panel").classList.toggle("open");
});

/* ===================== INIT ===================== */
applyStaticText();
connectFirebase();
</script>
</body>
</html>
